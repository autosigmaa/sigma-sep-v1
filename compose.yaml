services:
  kernel:
    build: .
    image: sigma-kernel:local
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      SIGMA_DB_PATH: /data/checkpoints.sqlite
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - kernel_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kernel_data:
